[tox]
envlist =
    py311-Plone60
    lint
skip_missing_interpreters = True

[testenv]
usedevelop = True
extras = test
deps =
    -cconstraints.txt
commands =
    zope-testrunner --all --test-path=src --auto-color --auto-progress {posargs}

[testenv:unit]
# The eligibility rules and field map import no Plone code, so they run
# without a site fixture. Fast enough to use as a pre-commit check.
commands =
    python -m unittest discover -s src/c_step_intake/tests -p "test_eligibility_rules.py" -v
    python -m unittest discover -s src/c_step_intake/tests -p "test_field_map.py" -v

[testenv:lint]
skip_install = True
deps =
    flake8
    isort
commands =
    flake8 src
    isort --check-only --diff src

[testenv:isort-apply]
skip_install = True
deps = isort
commands = isort src
